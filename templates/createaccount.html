<!-- createaccount.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/createaccount.css' %}">
</head>
<body>
     <head>
        <nav class=".nav">
            <div class="div1">
                <h1>Central Bank</h1>
            </div>
            <div class="div2">
                <ul>
                    <li><a href="{% url 'index' %}">Home</a></li>
                    <li><a href="">About</a></li>
                </ul>
            </div>
        </nav>
    </head>
    <main>
        <div class="div3">
            <h1 class="hone">Central Bank of India</h1>
        </div>
        <div class="div4">
            <form action="/accountcreate/" method="post">
                {% csrf_token %}
                <table>
                    <tr><th colspan="2">Create Account</th></tr>
                    <tr><td class="td">Account Number</td><td><input type="text" name="accountNumber"></td></tr>
                    <tr><td class="td">Customer Name</td><td><input type="text" name="customerName"></td></tr>
                    <tr><td class="td">Pin </td><td><input type="text" name="pinNumber"></td></tr>
                    <tr><td class="td">Customer Age</td><td><input type="text" name="customerAge"></td></tr>
                    <tr><td class="td">Mobile Number</td><td><input type="text" name="customerMobile"></td></tr>
                    <tr><td class="td">Customer Aadhaar</td><td><input type="text" name="customerAadhaar"></td></tr>
                    <tr><td class="td">Customer Address</td><td><input type="text" name="customerAddress"></td></tr>
                    <tr><td class="td">Customer State</td><td><input type="text" name="customerState"></td></tr>
                    <tr><td><input type="submit" value="submit" class="submit"></td><td><input class="submit" type="reset" value="clear"></td></tr>
                    <tr><td colspan="2" style="margin-top: 20px; font-size: x-large;">{{msg}}</td></tr>
                </table>
            </form>
        </div>
    </main>
</body>
</html>
